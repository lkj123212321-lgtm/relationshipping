lues[k]=clamp((state.values[k]||0)+v));state.node=c[2];save();render()}function custom(){const i=$('#custom'),t=i.value.trim();if(!t)return;choose(['自由輸入',t,'social',{curiosity:1,ambiguity:1}])}function cards(){return Object.entries(DATA.openings).map(([id,o])=>`<button class="opening" data-id="${id}"><div class="icon">${o.icon}</div><h2>${o.title}</h2><div class="sub">${o.sub}</div><div class="meta">◷ ${o.time}<br>⌖ ${o.place}</div><div class="mood">${o.mood}</div><div class="enter">進入情境　›</div></button>`).join('')}function render(){const app=$('#app');if(!state.opening){app.innerHTML=`<div class="wrap"><div class="hero"><div class="logo">☾</div><div><div class="tiny">UNSAID</div><h1>選擇開場情境</h1><p>每個開場都有不同社交壓力、信息差與關係傾向。</p></div></div><div class="openings">${cards()}</div></div>`;document.querySelectorAll('.opening').forEach(b=>b.onclick=()=>start(b.dataset.id));return}const o=DATA.openings[state.opening],n=current();if(n.chapter)state.meta={chapter:n.chapter,title:n.title,time:n.time,place:n.place};const m=state.meta||{chapter:'CHAPTER 01',title:o.title,time:o.time,place:o.place};const sig=Object.entries(state.values).filter(([k,v])=>k!=='definition'&&v>=35).sort((a,b)=>b[1]-a[1]).slice(0,3);app.innerHTML=`<div class="wrap game"><aside><div class="panel"><div class="brand"><div class="logo">☾</div><div><div class="tiny">CURRENT OPENING</div><h2>${o.title}</h2></div></div><div class="side-meta"><div>◷ ${m.time}</div><div>⌖ ${m.place}</div></div><div class="signals"><h3>可觀察的關係跡象</h3>${sig.length?sig.map(([k,v])=>`<div class="signal">${LABELS[k]}<small>${signal(k,v)}</small></div>`).join(''):'<small style="color:#71717a">目前未有足夠明顯的外在跡象。</small>'}<div class="signal" style="color:#fde68a">關係定義<small>${signal('definition',state.values.definition)}</small></div></div><button class="btn gm" id="gm">主持人查看數值</button><button class="btn" id="change">更換開場情境</button></div></aside><section class="main"><header class="head"><div><div class="tiny">${m.chapter}</div><h2>${m.title}</
